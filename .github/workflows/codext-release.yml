# Publish a codext release.
#
# Deliberately not a fork of upstream's `rust-release.yml`: that one builds on
# self-hosted runners this repository does not have, signs and notarizes, and
# publishes npm and Homebrew artifacts. Editing it down would leave a large
# file whose diff against upstream grows with every upstream change, and
# keeping merges clean is the whole reason this fork exists. A new file with
# its own name never conflicts.
#
# The asset names are the contract with `ags update`, which looks for
# `codext-<target>.tar.gz` containing a single executable called `codext`.
#
# The tag is the upstream Codex version and nothing else — codext reports that
# version because it *is* that version, plus a credential pool. So a second
# build on one upstream base reuses the tag rather than inventing a suffix, and
# this runs on a force-pushed tag as readily as a new one. That is what the
# `create || upload --clobber` at the bottom is for; `ags update` tells the two
# builds apart by the asset digest, not by the tag.
name: codext release

# 只接受手动触发。曾经是 `on: push: tags: ["v*"]`,但 GitHub 的运行器是 4 vCPU
# (Linux) 和 3 vCPU / 7 GB (macOS),实测一轮 1 小时 2 分,而同样的代码在自己的
# 32 核开发机和 M3 Max 上是几分钟的事。`publish` 又是 `needs: build`,慢的那条会
# 把整个发布卡住——包括已经编好的那条。
#
# 默认路径见 RELEASING.md:本地编、本地打包、`gh release upload --clobber`。
# 这个工作流留着是为了应急:手边没有 Apple Silicon 机器的时候还能出 macOS 包。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # gnu, not musl, and not by preference: the dependency tree reaches
          # `v8`, whose build script downloads a prebuilt static library, and
          # rusty_v8 publishes none for musl — the download 404s. Building V8
          # from source needs depot_tools and hours. `ags update` asks for musl
          # first and falls back to gnu, so it finds this.
          # Build on the oldest supported glibc baseline. ubuntu-latest is
          # currently 24.04 (glibc 2.39), which makes the resulting binary
          # unusable on Debian 12 (glibc 2.36).
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-14
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the channel; installing the target separately
      # is still needed because rustup only fetches the host one by default.
      #
      # `working-directory` is the whole point: that file lives in codex-rs, so
      # from the repository root rustup resolves the runner's default toolchain
      # and adds the target to that one, while the build a few steps down runs
      # under the pinned 1.95.0 — which then has no std for the target and dies
      # on `can't find crate for 'core'`.
      - name: Install the Rust target
        working-directory: codex-rs
        run: rustup target add ${{ matrix.target }}

      - if: endsWith(matrix.target, '-linux-gnu')
        name: Install the Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs

      - name: Build
        working-directory: codex-rs
        run: cargo build --release --target ${{ matrix.target }} -p codex-cli

      # The upstream binary is called `codex`. Renaming it here rather than in
      # Cargo.toml keeps `[[bin]]` identical to upstream, so the rename never
      # shows up as a merge conflict.
      - name: Package
        working-directory: codex-rs
        run: |
          set -euo pipefail
          staging="$(mktemp -d)"
          cp "target/${{ matrix.target }}/release/codex" "$staging/codext"
          chmod 755 "$staging/codext"
          tar -czf "codext-${{ matrix.target }}.tar.gz" -C "$staging" codext
          shasum -a 256 "codext-${{ matrix.target }}.tar.gz" \
            > "codext-${{ matrix.target }}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: codext-${{ matrix.target }}
          path: |
            codex-rs/codext-${{ matrix.target }}.tar.gz
            codex-rs/codext-${{ matrix.target }}.tar.gz.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --notes "codext $TAG — Codex with the hosted credential pool." \
            assets/* \
            || gh release upload "$TAG" --repo "${{ github.repository }}" \
                 --clobber assets/*
